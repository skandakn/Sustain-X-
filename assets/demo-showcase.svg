        <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" letter-spacing="1">SUPPORTED INPUTS</text>
        <rect x="0" y="10" width="90" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="45" y="26" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">📄 PDF / Doc</text>
        
        <rect x="100" y="10" width="90" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="145" y="26" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">🎙️ Live Voice</text>

        <rect x="200" y="10" width="94" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="247" y="26" text-anchor="middle" fill="#94a3b8" font-size="10" font-weight="600">📷 Vision OCR</text>
