        <!-- Bionic Reading Simulation: Bold first few letters -->
        <text x="14" y="62" fill="#f8fafc" font-family="'OpenDyslexic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="400">
          <tspan font-weight="800" fill="#34d399">1. Pl</tspan><tspan fill="#e2e8f0">ants use </tspan><tspan font-weight="800" fill="#34d399">sun</tspan><tspan fill="#e2e8f0">light to </tspan><tspan font-weight="800" fill="#34d399">ch</tspan><tspan fill="#e2e8f0">arge tiny cellular </tspan><tspan font-weight="800" fill="#34d399">bat</tspan><tspan fill="#e2e8f0">teries.</tspan>
        </text>

        <text x="14" y="96" fill="#94a3b8" font-family="'OpenDyslexic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">
          <tspan font-weight="700" fill="#67e8f9">2. Wat</tspan><tspan fill="#cbd5e1">er splits and rel</tspan><tspan font-weight="700" fill="#67e8f9">eas</tspan><tspan fill="#cbd5e1">es clean oxy</tspan><tspan font-weight="700" fill="#67e8f9">gen</tspan><tspan fill="#cbd5e1">.</tspan>
        </text>

        <text x="14" y="126" fill="#94a3b8" font-family="'OpenDyslexic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">
          <tspan font-weight="700" fill="#67e8f9">3. Ene</tspan><tspan fill="#cbd5e1">rgy is sto</tspan><tspan font-weight="700" fill="#67e8f9">red</tspan><tspan fill="#cbd5e1"> as ATP (bio-fuel for growth).</tspan>
        </text>
      </g>

