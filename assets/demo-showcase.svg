        <text x="12" y="22" fill="#94a3b8" font-size="10.5" font-weight="700">LEARNING METRICS</text>
        
        <text x="12" y="44" fill="#cbd5e1" font-size="10">Comprehension Score:</text>
        <rect x="140" y="34" width="120" height="12" rx="6" fill="#1e293b"/>
        <rect x="140" y="34" width="105" height="12" rx="6" fill="#10b981"/>
        <text x="268" y="44" text-anchor="end" fill="#34d399" font-size="10" font-weight="700">92%</text>

