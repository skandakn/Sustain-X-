          <rect x="6" y="2" width="3" height="20" rx="1.5" fill="#34d399"/>
          <rect x="12" y="8" width="3" height="8" rx="1.5" fill="#34d399"/>
          <rect x="18" y="0" width="3" height="24" rx="1.5" fill="#34d399"/>
          <rect x="24" y="4" width="3" height="16" rx="1.5" fill="#34d399"/>
          <rect x="30" y="7" width="3" height="10" rx="1.5" fill="#34d399"/>
          <rect x="36" y="1" width="3" height="22" rx="1.5" fill="#34d399"/>
          <rect x="42" y="5" width="3" height="14" rx="1.5" fill="#34d399"/>
          <rect x="48" y="9" width="3" height="6" rx="1.5" fill="#34d399"/>
          <rect x="54" y="3" width="3" height="18" rx="1.5" fill="#34d399"/>
