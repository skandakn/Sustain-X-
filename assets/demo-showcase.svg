        <text x="10" y="21" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">MODE:</text>
        <rect x="58" y="6" width="76" height="20" rx="4" fill="#10b981"/>
        <text x="96" y="20" text-anchor="middle" fill="#022c22" font-size="10" font-weight="800">⚡ Simplified</text>
        
