<svg width="1200" height="480" viewBox="0 0 1200 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b131f"/>
      <stop offset="100%" stop-color="#050a10"/>
    </linearGradient>

    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="emeraldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" rx="16" fill="url(#archBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(600, 42)">
    <text x="0" y="0" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="2">SYSTEM DESIGN &amp; INTEGRATIONS</text>
    <text x="0" y="28" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Sustain-X Full-Stack Architecture</text>
  </g>

  <!-- 4 Architecture Blocks -->
  
  <!-- Column 1: Client & Presentation Layer -->
  <g transform="translate(45, 100)">
    <rect width="255" height="340" rx="12" fill="url(#layerGrad1)" stroke="#3b82f6" stroke-width="1.2"/>
    <rect width="255" height="40" rx="12" fill="#1e3a8a" fill-opacity="0.3"/>
    <path d="M 0 28 L 0 40 L 255 40 L 255 28 Z" fill="#1e3a8a" fill-opacity="0.3"/>
    <text x="20" y="26" fill="#93c5fd" font-size="12" font-weight="800">1. PRESENTATION LAYER</text>

    <g transform="translate(18, 60)">
      <!-- Item 1 -->
      <rect width="219" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="700">Next.js 15 App Router</text>
      <text x="12" y="38" fill="#94a3b8" font-size="9.5">React 19 Server &amp; Client Components</text>

      <!-- Item 2 -->
      <rect y="60" width="219" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="82" fill="#ffffff" font-size="11" font-weight="700">Tailwind CSS + Framer Motion</text>
      <text x="12" y="98" fill="#94a3b8" font-size="9.5">Accessible UI &amp; Micro-animations</text>

      <!-- Item 3 -->
      <rect y="120" width="219" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="142" fill="#ffffff" font-size="11" font-weight="700">Accessibility Engine</text>
      <text x="12" y="158" fill="#94a3b8" font-size="9.5">OpenDyslexic • Bionic • Focus Mask</text>

      <!-- Item 4 -->
      <rect y="180" width="219" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="202" fill="#ffffff" font-size="11" font-weight="700">Multimodal Input Hub</text>
      <text x="12" y="218" fill="#94a3b8" font-size="9.5">Microphone STT • OCR • PDF Parser</text>
    </g>
  </g>

  <!-- Flow Arrow 1 -> 2 -->
  <g transform="translate(305, 270)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="30,0 24,-4 24,4" fill="#38bdf8"/>
  </g>

  <!-- Column 2: Edge API & Business Logic -->
  <g transform="translate(340, 100)">
    <rect width="255" height="340" rx="12" fill="url(#layerGrad1)" stroke="#10b981" stroke-width="1.2"/>
    <rect width="255" height="40" rx="12" fill="#064e3b" fill-opacity="0.3"/>
    <path d="M 0 28 L 0 40 L 255 40 L 255 28 Z" fill="#064e3b" fill-opacity="0.3"/>
    <text x="20" y="26" fill="#6ee7b7" font-size="12" font-weight="800">2. SERVICE ORCHESTRATION</text>

    <g transform="translate(18, 60)">
      <!-- Item 1 -->
      <rect width="219" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="700">lib/ai-service.ts</text>
      <text x="12" y="38" fill="#94a3b8" font-size="9.5">Unified AI Adapter Abstraction</text>

      <!-- Item 2 -->
      <rect y="60" width="219" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="82" fill="#ffffff" font-size="11" font-weight="700">Edge Next.js Route Handlers</text>
      <text x="12" y="98" fill="#94a3b8" font-size="9.5">/api/adapt • /api/notes • /api/live</text>

      <!-- Item 3 -->
      <rect y="120" width="219" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="142" fill="#ffffff" font-size="11" font-weight="700">Graceful Demo Engine</text>
      <text x="12" y="158" fill="#94a3b8" font-size="9.5">Zero-key offline / mock fallbacks</text>

      <!-- Item 4 -->
      <rect y="180" width="219" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="202" fill="#ffffff" font-size="11" font-weight="700">Clerk Auth Middleware</text>
      <text x="12" y="218" fill="#94a3b8" font-size="9.5">JWT Session validation &amp; Route Guard</text>
    </g>
  </g>

  <!-- Flow Arrow 2 -> 3 -->
  <g transform="translate(600, 270)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="30,0 24,-4 24,4" fill="#10b981"/>
  </g>

  <!-- Column 3: AI Inference Layer -->
  <g transform="translate(635, 100)">
    <rect width="255" height="340" rx="12" fill="url(#layerGrad1)" stroke="#8b5cf6" stroke-width="1.2"/>
    <rect width="255" height="40" rx="12" fill="#4c1d95" fill-opacity="0.3"/>
    <path d="M 0 28 L 0 40 L 255 40 L 255 28 Z" fill="#4c1d95" fill-opacity="0.3"/>
    <text x="20" y="26" fill="#c4b5fd" font-size="12" font-weight="800">3. AI INFERENCE CLOUD</text>

    <g transform="translate(18, 60)">
      <!-- Item 1 -->
      <rect width="219" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="700">Groq Cloud LPU™</text>
      <text x="12" y="38" fill="#94a3b8" font-size="9.5">Ultra-low latency inference (500+ tps)</text>

      <!-- Item 2 -->
      <rect y="60" width="219" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="82" fill="#ffffff" font-size="11" font-weight="700">Llama 3 / GPT-OSS 20B</text>
      <text x="12" y="98" fill="#94a3b8" font-size="9.5">Text simplification &amp; Mindmap trees</text>

      <!-- Item 3 -->
      <rect y="120" width="219" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="142" fill="#ffffff" font-size="11" font-weight="700">Qwen 3.6 Vision 27B</text>
      <text x="12" y="158" fill="#94a3b8" font-size="9.5">OCR, diagram analysis &amp; math parsing</text>

      <!-- Item 4 -->
      <rect y="180" width="219" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="202" fill="#ffffff" font-size="11" font-weight="700">Web Speech &amp; TTS Synthesizer</text>
      <text x="12" y="218" fill="#94a3b8" font-size="9.5">Pitch, rate &amp; tone adaptive audio</text>
    </g>
  </g>

  <!-- Flow Arrow 3 -> 4 -->
  <g transform="translate(895, 270)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="4 3"/>
    <polygon points="30,0 24,-4 24,4" fill="#8b5cf6"/>
  </g>

  <!-- Column 4: Storage & Data Persistence -->
  <g transform="translate(930, 100)">
    <rect width="225" height="340" rx="12" fill="url(#layerGrad1)" stroke="#f59e0b" stroke-width="1.2"/>
    <rect width="225" height="40" rx="12" fill="#78350f" fill-opacity="0.3"/>
    <path d="M 0 28 L 0 40 L 225 40 L 225 28 Z" fill="#78350f" fill-opacity="0.3"/>
    <text x="20" y="26" fill="#fcd34d" font-size="12" font-weight="800">4. DATA PERSISTENCE</text>

    <g transform="translate(18, 60)">
      <!-- Item 1 -->
      <rect width="189" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#ffffff" font-size="11" font-weight="700">Supabase PostgreSQL</text>
      <text x="12" y="38" fill="#94a3b8" font-size="9.5">Cloud relational database</text>

      <!-- Item 2 -->
      <rect y="60" width="189" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="82" fill="#ffffff" font-size="11" font-weight="700">Row Level Security (RLS)</text>
      <text x="12" y="98" fill="#94a3b8" font-size="9.5">Strict multi-tenant isolation</text>

      <!-- Item 3 -->
      <rect y="120" width="189" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="142" fill="#ffffff" font-size="11" font-weight="700">Student Profiles &amp; Notes</text>
      <text x="12" y="158" fill="#94a3b8" font-size="9.5">Custom prefs &amp; session states</text>

      <!-- Item 4 -->
      <rect y="180" width="189" height="48" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="12" y="202" fill="#ffffff" font-size="11" font-weight="700">Progress Tracking</text>
      <text x="12" y="218" fill="#94a3b8" font-size="9.5">Analytics &amp; teacher dashboard</text>
    </g>
  </g>
</svg>
