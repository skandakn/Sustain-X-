<svg width="1200" height="680" viewBox="0 0 1200 680" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="windowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#070c14"/>
    </linearGradient>

    <linearGradient id="cardBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Window Frame with macOS Chrome -->
  <g filter="url(#cardShadow)">
    <rect x="20" y="20" width="1160" height="640" rx="16" fill="url(#windowBg)" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Window Titlebar -->
    <path d="M 20 36 A 16 16 0 0 1 36 20 L 1164 20 A 16 16 0 0 1 1180 36 L 1180 68 L 20 68 Z" fill="#141e30"/>
    <line x1="20" y1="68" x2="1180" y2="68" stroke="#1e293b" stroke-width="1"/>
    
    <!-- Traffic lights -->
    <circle cx="50" cy="44" r="6" fill="#ef4444"/>
    <circle cx="70" cy="44" r="6" fill="#f59e0b"/>
    <circle cx="90" cy="44" r="6" fill="#10b981"/>

    <!-- URL / App Bar -->
    <rect x="180" y="32" width="460" height="24" rx="6" fill="#0b111e" stroke="#1e293b" stroke-width="1"/>
    <circle cx="198" cy="44" r="3.5" fill="#10b981"/>
    <text x="212" y="49" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">https://sustain-x-learn.vercel.app/learn (Adaptive Mode Active)</text>

    <!-- Top Action Badges -->
    <rect x="940" y="32" width="100" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="990" y="48" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">● AI Live Sync</text>
    
    <rect x="1055" y="32" width="95" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="1102" y="48" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">👤 Skanda K N</text>
  </g>

  <!-- Left Column: Source Complex Content (Before Adaptation) -->
  <g transform="translate(48, 88)">
    <rect width="330" height="544" rx="12" fill="url(#cardBg1)" stroke="#334155" stroke-width="1.2"/>
    
    <!-- Column Header -->
    <rect x="0" y="0" width="330" height="48" rx="12" fill="#1e293b"/>
    <path d="M 0 36 L 0 48 L 330 48 L 330 36 Z" fill="#1e293b"/>
    <text x="18" y="30" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">📄 RAW LEARNING MATERIAL</text>
    <rect x="235" y="14" width="78" height="20" rx="10" fill="#475569" fill-opacity="0.4"/>
    <text x="274" y="28" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Standard PDF</text>

    <!-- Source Content Box -->
    <g transform="translate(18, 65)">
      <text x="0" y="15" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Photosynthesis &amp; ATP Synthesis</text>
      
      <!-- Unadapted Dense Text Mockup -->
      <text x="0" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="400" line-height="1.5">
        <tspan x="0" dy="0">During the light-dependent reactions of</tspan>
        <tspan x="0" dy="18">photosynthesis occurring within the thylakoid</tspan>
        <tspan x="0" dy="18">membrane, photons excite electrons in</tspan>
        <tspan x="0" dy="18">photosystem II (P680). These energized</tspan>
        <tspan x="0" dy="18">electrons traverse the cytochrome b6f</tspan>
        <tspan x="0" dy="18">complex via plastoquinone, establishing</tspan>
        <tspan x="0" dy="18">a proton gradient that drives ATP synthase...</tspan>
      </text>

      <!-- Pain Points Indicator Box -->
      <rect x="0" y="180" width="294" height="110" rx="8" fill="#7f1d1d" fill-opacity="0.25" stroke="#ef4444" stroke-width="1"/>
      <text x="12" y="202" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">⚠️ Accessibility Barriers Detected:</text>
      <text x="12" y="222" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• High cognitive load &amp; dense jargon</text>
      <text x="12" y="240" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• Lacks visual hierarchy for ADHD/Dyslexia</text>
      <text x="12" y="258" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">• No audio playback or sensory controls</text>

