        <circle cx="0" cy="0" r="24" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
        <text x="0" y="3" text-anchor="middle" fill="#a7f3d0" font-size="9" font-weight="700">H₂O Split</text>
      </g>

      <!-- Child Node 2 -->
