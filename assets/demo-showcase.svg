        <line x1="90" y1="-80" x2="0" y2="0" stroke="#0ea5e9" stroke-width="1.5"/>
        <circle cx="0" cy="0" r="26" fill="#4c1d95" stroke="#c084fc" stroke-width="2"/>
        <text x="0" y="-2" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700">Glucose</text>
        <text x="0" y="9" text-anchor="middle" fill="#e9d5ff" font-size="8">Synthesis</text>
      </g>

