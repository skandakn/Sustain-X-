<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e14"/>
      <stop offset="50%" stop-color="#0b1a1f"/>
      <stop offset="100%" stop-color="#051016"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glassmorphism Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
      <circle cx="40" cy="0" r="1" fill="#10b981" fill-opacity="0.3"/>
    </pattern>

    <style>
      @keyframes floatAnimation {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 0.8; }
      }
      @keyframes waveMotion {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 1000; }
      }
      .floating-pill {
        animation: floatAnimation 4s ease-in-out infinite;
      }
      .pulsing-glow {
        animation: pulseGlow 3s ease-in-out infinite;
      }
      .wave-line {
        stroke-dasharray: 20 10;
        animation: waveMotion 30s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="420" rx="20" fill="url(#grid)"/>

  <!-- Glowing background orbs -->
  <circle cx="200" cy="100" r="140" fill="#10b981" fill-opacity="0.15" filter="url(#glow)" class="pulsing-glow"/>
  <circle cx="1000" cy="300" r="160" fill="#06b6d4" fill-opacity="0.12" filter="url(#glow)" class="pulsing-glow"/>
  <circle cx="600" cy="200" r="120" fill="#3b82f6" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- Decorative Wave Lines -->
  <path d="M-50 320 Q 300 220, 600 340 T 1250 260" fill="none" stroke="url(#primaryGrad)" stroke-width="2" stroke-opacity="0.3" class="wave-line"/>
  <path d="M-50 350 Q 350 250, 650 370 T 1250 290" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.2" class="wave-line"/>

  <!-- Outer Glowing Border -->
  <rect x="1" y="1" width="1198" height="418" rx="19" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Top Badge: Hackathon & Innovation Category -->
  <g transform="translate(600, 52)">
    <rect x="-140" y="-16" width="280" height="32" rx="16" fill="#0f292e" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="-116" cy="0" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-98" y="5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">AI ACCESSIBILITY PLATFORM</text>
  </g>

  <!-- Logo Mark + Typography -->
  <g transform="translate(600, 140)">
    <!-- Logo Icon Group -->
    <g transform="translate(-230, -32)">
      <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#primaryGrad)" filter="url(#subtleGlow)"/>
      <rect x="2" y="2" width="60" height="60" rx="14" fill="#06191f"/>
      <!-- Stylized 'A' + Neural Nodes -->
      <path d="M32 14L18 48H26L29 40H35L38 48H46L32 14Z" fill="url(#primaryGrad)"/>
      <circle cx="32" cy="24" r="3.5" fill="#ffffff"/>
      <circle cx="21" cy="44" r="2.5" fill="#10b981"/>
      <circle cx="43" cy="44" r="2.5" fill="#06b6d4"/>
      <line x1="32" y1="24" x2="21" y2="44" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>
      <line x1="32" y1="24" x2="43" y2="44" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.6"/>
    </g>

    <!-- Main Title -->
    <text x="-145" y="16" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="52" font-weight="900" letter-spacing="-1">SUSTAIN-X</text>
    <text x="148" y="-4" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" letter-spacing="2">v2.0</text>
  </g>

  <!-- Slogan / Subtitle -->
  <text x="600" y="208" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400">
    Technology that adapts to the way <tspan fill="#f1f5f9" font-weight="700">every unique mind learns</tspan>.
  </text>
  <text x="600" y="236" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Transforming complex textbooks, live lectures &amp; videos into Dyslexia-friendly, ADHD-focused, and Multimodal formats.
  </text>

  <!-- Feature Highlights Chips Row -->
  <g transform="translate(600, 310)">
    <!-- Pill 1: Bionic Reading & Dyslexia -->
    <g transform="translate(-460, 0)">
      <rect x="0" y="0" width="168" height="42" rx="10" fill="#0c1e28" stroke="#1e3a4b" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="9" fill="#10b981" fill-opacity="0.2"/>
      <text x="22" y="25" text-anchor="middle" fill="#10b981" font-size="12">📖</text>
      <text x="40" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Bionic &amp; Dyslexia</text>
    </g>

    <!-- Pill 2: ADHD Sensory Ruler -->
    <g transform="translate(-275, 0)">
      <rect x="0" y="0" width="168" height="42" rx="10" fill="#0c1e28" stroke="#1e3a4b" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="9" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="22" y="25" text-anchor="middle" fill="#06b6d4" font-size="12">🎯</text>
      <text x="40" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">ADHD Focus Ruler</text>
    </g>

    <!-- Pill 3: TTS & Realtime Audio -->
    <g transform="translate(-90, 0)">
      <rect x="0" y="0" width="170" height="42" rx="10" fill="#0c1e28" stroke="#1e3a4b" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="9" fill="#8b5cf6" fill-opacity="0.2"/>
      <text x="22" y="25" text-anchor="middle" fill="#a78bfa" font-size="12">🎙️</text>
      <text x="40" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Audio &amp; Speech</text>
    </g>

    <!-- Pill 4: Concept Mindmaps -->
    <g transform="translate(95, 0)">
      <rect x="0" y="0" width="175" height="42" rx="10" fill="#0c1e28" stroke="#1e3a4b" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="9" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="22" y="25" text-anchor="middle" fill="#fbbf24" font-size="12">🗺️</text>
      <text x="40" y="25" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Concept Mind Maps</text>
    </g>

    <!-- Pill 5: Groq AI Powered -->
    <g transform="translate(285, 0)">
      <rect x="0" y="0" width="175" height="42" rx="10" fill="#0c1e28" stroke="#10b981" stroke-width="1.2"/>
      <circle cx="22" cy="21" r="9" fill="#10b981" fill-opacity="0.25"/>
      <text x="22" y="25" text-anchor="middle" fill="#34d399" font-size="12">⚡</text>
      <text x="40" y="25" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Groq AI Llama 3</text>
    </g>
  </g>

  <!-- Bottom Mini Tech Row -->
  <g transform="translate(600, 385)">
    <text x="0" y="0" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="1">
      NEXT.JS 15 • REACT 19 • TYPESCRIPT • TAILWIND • SUPABASE • CLERK • FRAMER MOTION
    </text>
  </g>
</svg>
